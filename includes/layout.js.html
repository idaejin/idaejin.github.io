<script>
document.addEventListener("DOMContentLoaded", function () {
  var main = document.querySelector("main#quarto-document-content");
  var side = document.getElementById("author-sidebar");
  if (!main || !side || main.classList.contains("has-author-sidebar")) return;

  var wrap = document.createElement("div");
  wrap.className = "page-main";

  var nodes = Array.prototype.slice.call(main.childNodes);
  nodes.forEach(function (node) {
    if (node === side) return;
    wrap.appendChild(node);
  });

  main.insertBefore(side, main.firstChild);
  main.appendChild(wrap);
  main.classList.add("has-author-sidebar");
});
</script>
